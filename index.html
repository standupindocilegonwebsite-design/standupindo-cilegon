<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link id="app-icon" rel="icon" type="image/png" href="/assets/images/favicon.png?v=3" />
    <script>
      (() => {
        const path = window.location.pathname;
        const isAdmin = path.startsWith('/admin');
        const isMember = path.startsWith('/member');
        const manifest = isAdmin
          ? '/manifest.admin.webmanifest'
          : isMember
            ? '/manifest.member.webmanifest'
            : '/manifest.public.webmanifest';
        const icon = document.getElementById('app-icon');
        if (icon) icon.setAttribute('href', '/assets/images/favicon.png?v=3');
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifest;
        document.head.appendChild(link);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1a3b" />
    <title>Standupindo Cilegon</title>
    <meta name="description" content="Komunitas stand-up comedy di Cilegon. Ruang untuk tampil, berkarya, dan berkembang bersama. Temukan Open Mic, Event, dan Komika Standupindo Cilegon." />
    <meta property="og:image" content="/assets/images/Standupindo_CIlegon_Logo.jpeg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/images/Standupindo_CIlegon_Logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
